name: Nova checks

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and logic tests
        run: npm run check
      - name: Check GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas
