name: Nova checks

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and logic tests
        run: npm run check
      - name: Check GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas
      - name: Package preview extension and verify bundled modules
        run: |
          bash scripts/package.sh
          unzip -t dist/Nova-v0.7.0-dev-GNOME.zip
          unzip -Z1 dist/Nova-v0.7.0-dev-GNOME.zip | grep -Fx lib/live-activity.js
          unzip -Z1 dist/Nova-v0.7.0-dev-GNOME.zip | grep -Fx lib/notification-preview.js
          unzip -Z1 dist/Nova-v0.7.0-dev-GNOME.zip | grep -Fx lib/themes.js
          unzip -Z1 dist/Nova-v0.7.0-dev-GNOME.zip | grep -Fx schemas/gschemas.compiled
          test "$(unzip -p dist/Nova-v0.7.0-dev-GNOME.zip metadata.json |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["uuid"])')" = "nova@tobiasguta.github.io"
